<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчёт по мастерам</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 32px;
            max-width: 460px;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .description {
            color: #666;
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            font-size: 13px;
            color: #333;
            background: #fafafa;
            cursor: pointer;
        }
        input[type="file"]:focus {
            outline: none;
            border-color: #888;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #2c2c2c;
            color: #fff;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn:hover {
            background: #3d3d3d;
        }
        .btn:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .error {
            background: #fff5f5;
            border: 1px solid #fcc;
            color: #b30000;
            padding: 12px;
            border-radius: 3px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }
        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Отчёт по мастерам</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" onsubmit="handleSubmit()">
            <div class="form-group">
                <label for="fileInput">Файл Excel (.xlsx)</label>
                <input type="file" id="fileInput" name="file" accept=".xlsx,.xls" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Сформировать отчёт</button>
            <div class="loading" id="loading">Идёт обработка файла...</div>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');

        fileInput.addEventListener('change', function() {
        });

        function handleSubmit() {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Идёт обработка...';
            loading.classList.add('active');
        }
    </script>
</body>
</html>
